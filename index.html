<!DOCTYPE html>
<!-- Updated: page is live -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Curioxy AI — Notify Me on Launch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080F; --violet:#6C3CE1; --blue:#3B82F6; --cyan:#00D4FF;
  --text:#F5F5FA; --text-dim:#9CA0B5; --text-faint:#5C6079;
  --glass: rgba(255,255,255,0.05); --glass-border: rgba(255,255,255,0.1);
  --font-display:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
  --ease: cubic-bezier(0.16,1,0.3,1);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{ height:100%; }
body{ background:var(--bg); color:var(--text); font-family:var(--font-display); -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center; overflow-x:hidden; }

.glow-field{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
.glow-field span{ position:absolute; border-radius:50%; filter:blur(110px); opacity:.32; animation:drift 24s ease-in-out infinite; }
.glow-field span:nth-child(1){ width:520px; height:520px; background:var(--violet); top:-160px; left:-140px; }
.glow-field span:nth-child(2){ width:460px; height:460px; background:var(--blue); bottom:-160px; right:-100px; animation-delay:-8s; }
.glow-field span:nth-child(3){ width:400px; height:400px; background:var(--cyan); top:40%; right:-160px; animation-delay:-16s; }
@keyframes drift{ 0%,100%{transform:translate(0,0);} 50%{transform:translate(24px,-28px);} }
@media (prefers-reduced-motion: reduce){ .glow-field span{animation:none;} }

.stage{ position:relative; z-index:1; max-width:520px; width:100%; padding:32px 24px; text-align:center; }

.eyebrow{ display:inline-flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--cyan); background:rgba(0,212,255,0.08); border:1px solid rgba(0,212,255,0.25); padding:7px 15px; border-radius:999px; margin-bottom:28px; }
.eyebrow .dot{ width:6px; height:6px; border-radius:50%; background:var(--cyan); box-shadow:0 0 8px var(--cyan); }

h1{ font-size:clamp(32px,7vw,48px); font-weight:800; letter-spacing:-0.03em; line-height:1.08; margin-bottom:18px;
  background:linear-gradient(135deg,#fff 20%,var(--cyan) 90%); -webkit-background-clip:text; background-clip:text; color:transparent; }

.sub{ color:var(--text-dim); font-size:16.5px; line-height:1.6; max-width:38ch; margin:0 auto 40px; }

.form-row{ display:flex; gap:10px; max-width:420px; margin:0 auto; }
.email-input{ flex:1; background:var(--glass); border:1px solid var(--glass-border); border-radius:14px; padding:15px 18px; font-family:var(--font-display); font-size:15px; color:var(--text); }
.email-input::placeholder{ color:var(--text-faint); }
.email-input:focus{ outline:none; border-color:var(--blue); }
.notify-btn{ font-family:var(--font-display); font-size:15px; font-weight:700; padding:15px 26px; border-radius:14px; cursor:pointer; border:none; white-space:nowrap;
  background:linear-gradient(135deg,var(--violet),var(--blue),var(--cyan)); color:#08080F; transition:transform .2s var(--ease), box-shadow .2s var(--ease); }
.notify-btn:hover{ transform:translateY(-2px); box-shadow:0 12px 30px -10px rgba(108,60,225,0.6); }
.notify-btn:disabled{ opacity:.6; cursor:default; transform:none; box-shadow:none; }

.status-note{ font-family:var(--font-mono); font-size:12.5px; color:var(--text-faint); margin-top:16px; min-height:18px; }
.status-note.success{ color:var(--cyan); }
.status-note.error{ color:#F0997B; }

.footer-note{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); margin-top:44px; letter-spacing:.04em; }

@media (max-width:480px){
  .form-row{ flex-direction:column; }
}
</style>
</head>
<body>
<div class="glow-field"><span></span><span></span><span></span></div>

<div class="stage">
  <span class="eyebrow"><span class="dot"></span>Launching soon on Kickstarter</span>
  <h1>Point your phone at anything.</h1>
  <p class="sub">Curioxy AI identifies it, then shows you real, live marketplace listings — never a guess, never an estimate. Be first to know when we launch.</p>

  <div class="form-row">
    <input type="email" class="email-input" id="emailInput" placeholder="you@example.com" autocomplete="email">
    <button class="notify-btn" id="notifyBtn">Notify me on launch</button>
  </div>
  <div class="status-note" id="statusNote"></div>

  <div class="footer-note">CURIOXY AI — NO AI-GENERATED PRICES, EVER.</div>
</div>

<script>
const emailInput = document.getElementById('emailInput');
const notifyBtn = document.getElementById('notifyBtn');
const statusNote = document.getElementById('statusNote');

function isValidEmail(email){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

// ============================================================
// EMAIL SIGNUP — NEEDS KIT (ConvertKit) CREDENTIALS BEFORE THIS WORKS
// ============================================================
// Replace KIT_FORM_ID below with your real form ID from Kit.
// Find it: Kit dashboard → Grow → Landing Pages & Forms → your form
//          → the ID is the number in the URL, e.g. .../forms/1234567
//
// Until this is set, the page deliberately shows an error rather than
// pretending a signup worked. Silently losing real signups is worse
// than an honest error message.
const KIT_FORM_ID = 'REPLACE_ME';

async function handleSignup(){
  const email = emailInput.value.trim();
  if(!isValidEmail(email)){
    statusNote.textContent = 'Enter a valid email address.';
    statusNote.className = 'status-note error';
    return;
  }

  if(KIT_FORM_ID === 'REPLACE_ME'){
    statusNote.textContent = 'Signup is not connected yet — check back shortly.';
    statusNote.className = 'status-note error';
    console.error('KIT_FORM_ID is not set. Signups are NOT being saved.');
    return;
  }

  notifyBtn.disabled = true;
  notifyBtn.textContent = 'Adding you…';
  try{
    const res = await fetch(`https://app.kit.com/forms/${KIT_FORM_ID}/subscriptions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ email_address: email }),
    });
    if(!res.ok) throw new Error(`Kit returned ${res.status}`);
    statusNote.textContent = "You're on the list — we'll email you at launch.";
    statusNote.className = 'status-note success';
    emailInput.value = '';
    notifyBtn.textContent = 'Notify me on launch';
  } catch(e){
    statusNote.textContent = "Couldn't save that — try again in a moment.";
    statusNote.className = 'status-note error';
    notifyBtn.textContent = 'Notify me on launch';
    console.error('Signup failed:', e);
  }
  notifyBtn.disabled = false;
}

notifyBtn.addEventListener('click', handleSignup);
emailInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') handleSignup(); });
</script>

</body>
</html>
